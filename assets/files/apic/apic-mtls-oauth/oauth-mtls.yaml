                    - gatewayscript:
                        version: '2.0.0'
                        title: 'gatewayscript'
                        source: "// Read the raw cert header using API Connect context\nvar raw = context.get('request.headers.x-client-certificate');\n\n// Strip PEM armor and ALL whitespace, leaving only raw base64\nvar base64only = raw\n  .replace('-----BEGIN CERTIFICATE-----', '')\n  .replace('-----END CERTIFICATE-----', '')\n  .replace(/\\s+/g, '');\n\nconsole.error('[CERT-NORMALIZE] base64 length: ' + base64only.length);\n\n// Overwrite the header with pure base64 for the XSLT to consume\ncontext.set('x-client-certificate', base64only);"
                    - xslt:
                        version: '2.1.0'
                        title: 'xslt'
                        input: false
                        serialize-output: false
                        source: "<xsl:stylesheet version=\"1.0\"\n  xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\n  xmlns:dp=\"http://www.datapower.com/extensions\"\n  xmlns:apigw=\"http://www.ibm.com/xmlns/datapower/2017/11/apigateway\"\n  extension-element-prefixes=\"dp apigw\"\n  exclude-result-prefixes=\"dp apigw\">\n  <xsl:output method=\"xml\" indent=\"yes\"/>\n  <xsl:template match=\"/\">\n    <!-- Read raw base64 cert from header -->\n    <xsl:variable name=\"base64cert\"\n      select=\"apigw:get-variable('x-client-certificate')\"/>\n    <!-- Parse using cert: prefix (pure base64, no headers) -->\n    <xsl:variable name=\"certDetails\"\n      select=\"dp:get-cert-details(concat('cert:', $base64cert))\"/>\n      \n<xsl:for-each select=\"$certDetails/*\">\n  <xsl:message dp:priority=\"error\">\n    <xsl:value-of select=\"concat('NODE: [', local-name(), '] = ', .)\"/>\n  </xsl:message>\n</xsl:for-each>      \n      \n      \n<xsl:variable name=\"subject\"\n  select=\"string($certDetails/CertificateDetails/*[local-name()='Subject'])\"/>\n<xsl:variable name=\"issuer\"\n  select=\"string($certDetails/CertificateDetails/*[local-name()='Issuer'])\"/>\n<xsl:variable name=\"serial\"\n  select=\"string($certDetails/CertificateDetails/*[local-name()='Serial Number'])\"/>\n\n    <!-- Log at error level -->\n<xsl:message dp:priority=\"error\">\n  <xsl:value-of select=\"$certDetails\"/>\n</xsl:message>\n<xsl:message dp:priority=\"error\">\n  <xsl:value-of select=\"concat('[CERT] Subject:    ', $subject)\"/>\n</xsl:message>\n<xsl:message dp:priority=\"error\">\n  <xsl:value-of select=\"concat('[CERT] Issuer:     ', $issuer)\"/>\n</xsl:message>\n<xsl:message dp:priority=\"error\">\n  <xsl:value-of select=\"concat('[CERT] Serial:     ', $serial)\"/>\n</xsl:message>\n    <!-- Write to API Connect context variables -->\n<apigw:set-variable name=\"'localcertsubject'\"   value=\"$subject\"/>\n<apigw:set-variable name=\"'localcertissuer'\"    value=\"$issuer\"/>\n<apigw:set-variable name=\"'localcertserial'\"    value=\"$serial\"/>\n\n    <xsl:copy-of select=\"/\"/>\n\n  </xsl:template>\n\n</xsl:stylesheet>\n"
                        compile-settings: {}
                    - gatewayscript:
                        version: '2.0.0'
                        title: 'gatewayscript'
                        source: "var oauth = context.get('oauth');\n//var test = \"test\";\nconsole.error('*****')\nconsole.error(oauth)\nconsole.error('*****<<<')\n\nconst consentid = context.get(\"oauth.processing.metadata.access_token\").substring(2)\n//context.set(\"oauth.processing.scope\",(oauth.processing.verified_code.scope +\" \"+ consentid))\n//context.set(\"oauth.processing.verified_code.scope\",(oauth.processing.verified_code.scope +\" \"+ consentid))\n\nconst localcertsubject = context.get('localcertsubject');\n\n//context.set(\"oauth.processing.metadata.access_token\",mtls)\ncontext.set(\"oauth.processing.metadata.payload\",\"a:\"+localcertsubject)\ncontext.set(\"oauth.processing.metadata.access_token\",\"a:\"+localcertsubject)\n//context.set(\"oauth.processing.verified_code.misc_info\",\"!ma=a:\"+localcertsubject +\"!mp=a:\" +localcertsubject)\n\noauth = context.get('oauth');\n//var test = \"test\";\nconsole.error('*****')\nconsole.error(oauth)\nconsole.error('*****<<<')"
                    - oauth:
                        title: 'oauth-auto-generated-3'
                        version: '2.0.0'
                        description: 'This oauth policy performs all OAuth/OpenID Connect protocol steps that are needed for token path by default. The inputs and outputs of each of the steps are driven by documented context variables. Add or remove the Supported OAuth Components as required.'
                        oauth-provider-settings-ref:
                          default: 'oauth-mtls'
                        supported-oauth-components:
                          - 'OAuthGenerateAccessToken'
                - condition: '($operationPath() = ''/oauth2/authorize'')'
                  execute:
                    - user-security:
                        title: 'user-security-auto-generated'
                        version: '2.1.0'
                        description: 'This user security policy performs EI(basic) and AU(auth url) check for oauth assembly. Change the security check method as required.'
                        factor-id: 'default'
                        extract-identity-method: 'redirect'
                        ei-stop-on-error: true
